/* Palette close to the screenshot and refined SaaS look */
:root{
  --page-bg: #dfe3e7;         /* outer page tint */
  --panel-bg: #ffffff;        /* white card background */
  --surface: #f5f7f8;         /* subtle surface */
  --muted: #66707a;           /* muted copy */
  --text: #12202a;            /* main text (dark) */
  --accent-green: #6c9a00;    /* top green strip */
  --accent: #e8862c;          /* small accent */
  --line: #d0d7db;            /* separators */
  --card-blue: #dbe7ff;       /* booking card */
  --card-blue-2: #c8d9ff;
  --card-highlight: #eaf7d7;  /* pale green highlight */
  --danger: #d9534f;
  --shadow-lg: 0 14px 40px rgba(14,20,28,0.08);
  --radius-lg: 12px;
  --radius-md: 8px;
  --mono: 'IBM Plex Mono', monospace;
  color-scheme: light;
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
}

/* Reset */
*{box-sizing:border-box}
html,body{height:100%; margin:0; background:var(--page-bg); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}
body{padding:20px; display:flex; justify-content:center; align-items:flex-start; color:var(--text);}

/* App container */
.app{width:100%; max-width:1320px; margin:0 auto;}

/* HEADER: logo, title and right controls */
header.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
  margin-bottom:12px;
  flex-wrap:wrap;
}

/* Brand area */
.brand{display:flex; gap:12px; align-items:center;}
.brand .mark{
  width:120px;
  height:44px;
  border-radius:8px;
  background-color:#000;           /* fallback color while logo missing */
  background-position:center;
  background-repeat:no-repeat;
  background-size:contain;
  display:inline-block;
  flex-shrink:0;
  box-shadow:0 6px 18px rgba(14,20,28,0.08);
  /* Replace the URL below or add your logo at ./assets/incitec-logo.png */
  background-image: url('assets/incitec-logo.png');
  /* if you prefer to keep the old text mark, you can set text-indent to -9999px to hide it */
  text-indent: -9999px;
  overflow:hidden;
}
.brand h1{margin:0; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:18px; color:var(--text);}
.brand .sub{font-size:12px; color:var(--muted); margin-top:2px;}

/* Top green navigation strip */
.top-strip{
  width:100%;
  background:linear-gradient(90deg,var(--accent-green), #84b300);
  border-radius:8px;
  padding:8px 12px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 6px 18px rgba(12,18,24,0.06);
  color:#fff;
  margin-top:8px;
}
.top-strip .nav{display:flex; gap:8px; align-items:center;}
.top-strip .nav .pill{
  background:rgba(255,255,255,0.08);
  padding:6px 10px;
  border-radius:999px;
  font-weight:700;
  font-size:13px;
  color:#fff;
}
.top-strip .site-select{margin-left:auto; display:flex; gap:8px; align-items:center;}
.top-strip select, .top-strip button.go{
  padding:6px 10px; border-radius:6px; border:none; font-weight:700; font-size:13px;
}
.top-strip button.go{ background:#fff; color:var(--accent-green); }

/* Colour key (legend) */
.colour-key{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center;}
.key-pill{display:inline-flex; gap:8px; align-items:center; padding:7px 10px; background:var(--panel-bg); border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; font-size:13px;}
.key-swatch{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,0.06);}

/* MAIN layout */
.main-wrap{
  margin-top:12px;
  display:grid;
  grid-template-columns: 1fr 320px;
  gap:16px;
}
@media (max-width:1100px){
  .main-wrap{grid-template-columns:1fr;}
}

/* Left panel (calendar / scheduler) */
.calendar-panel{
  background:var(--panel-bg);
  border-radius:var(--radius-lg);
  padding:14px;
  border:1px solid var(--line);
  box-shadow:var(--shadow-lg);
}

/* top of calendar */
.calendar-header{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px;}
.calendar-header .date{font-weight:700; font-family:'Space Grotesk',sans-serif; font-size:16px;}
.calendar-header .controls{display:flex; gap:8px; align-items:center;}

/* time grid layout: left time column + scrollable columns area */
.scheduler-wrap{display:flex; gap:12px; align-items:flex-start;}
.time-column{
  width:78px;
  background:linear-gradient(180deg, #fafcfc, #f3f6f7);
  border-radius:8px;
  padding:8px;
  border:1px solid var(--line);
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.time-cell{font-family:var(--mono); font-size:13px; color:var(--muted); height:34px; display:flex; align-items:center; padding-left:6px;}

/* columns area */
.cols{
  flex:1;
  display:flex;
  gap:12px;
  overflow:auto;
  padding-bottom:6px;
  align-items:flex-start;
}
