name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./
          publish_branch: gh-pages
          # Use a personal access token stored in repository secret GH_PAGES_TOKEN
          # Falls back to the automatic GITHUB_TOKEN if GH_PAGES_TOKEN is not set
          github_token: ${{ secrets.GH_PAGES_TOKEN || github.token }}
          commit_message: 'Deploy GitHub Pages site'
